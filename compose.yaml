services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nusantara_wear
    ports:
      - "5432:5432"
    volumes:
      - nusantara-wear-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nusantara_wear"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nusantara-wear-postgres:
